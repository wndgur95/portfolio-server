name: Portfolio Backend Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '**'
  pull_request:
    branches: [ master ]
    paths:
      - '**'

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: portfolio-server

jobs:
  build:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.10.0
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Build application
      run: pnpm run build
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest
        buildkitd-flags: --allow-insecure-entitlement security.insecure
        
    - name: Configure Docker for Harbor
      run: |
        # Kubernetes 환경에서는 Docker daemon 설정을 다르게 처리
        mkdir -p ~/.docker
        echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' > ~/.docker/config.json
        
    - name: Log in to Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.HARBOR_REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.HARBOR_REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./api.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Output image info
      run: |
        echo "🚀 Build completed successfully!"
        echo "Image: ${{ steps.meta.outputs.tags }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}" 