name: Portfolio Backend Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: portfolio-backend
  NODE_ENV: production
  PNPM_VERSION: 9.10.0
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: ${{ env.PNPM_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build application
      run: pnpm run build
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest
        buildkitd-flags: --allow-insecure-entitlement security.insecure
        platforms: linux/amd64,linux/arm64
        
    - name: Configure Docker for Harbor
      run: |
        echo "Configuring Docker for Harbor registry..."
        if [ -d "/etc/docker" ]; then
          echo '{"insecure-registries": ["${{ env.REGISTRY }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || echo "Docker restart failed, continuing..."
        else
          echo "Docker directory not found, using default configuration"
        fi
        
    - name: Log in to Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.HARBOR_REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=stable,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Portfolio Backend
          org.opencontainers.image.description=Portfolio Backend Application
          org.opencontainers.image.vendor=Joung Project
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created={{created}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./api.Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
        
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        
    - name: Image size check
      run: |
        echo "Checking image size..."
        IMAGE_SIZE=$(docker images ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:latest --format "table {{.Size}}" | tail -n 1)
        echo "Image size: $IMAGE_SIZE"
        
    - name: Output build info
      run: |
        echo "🚀 Build completed successfully!"
        echo "Image: ${{ steps.meta.outputs.tags }}"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Author: ${{ github.actor }}"
        echo "Event: ${{ github.event_name }}"
        
    - name: Notify build completion
      if: success()
      run: |
        echo "✅ Docker image built and pushed successfully"
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Project: ${{ env.PROJECT }}"
        echo "Image: ${{ env.IMAGE_NAME }}"
        echo "Tags: ${{ steps.meta.outputs.tags }}" 