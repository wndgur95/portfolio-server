name: Portfolio Backend Deploy

on:
  # build 워크플로우 완료 후 자동 실행
  workflow_run:
    workflows: ["Portfolio Backend Build"]
    types:
      - completed
    branches: [ master ]

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: ${{ github.ref_name }}
  CD_REPOSITORY: k8s-enterprise

jobs:
  deploy:
    name: Update helm image tag
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout k8s-enterprise
      uses: actions/checkout@v4
      with:
        repository: wndgur95/${{ env.CD_REPOSITORY }}
        token: ${{ secrets.PAT_TOKEN }}
        path: ${{ env.CD_REPOSITORY }}
        
    - name: Set tag from build workflow
      id: set-tag
      run: |
        # GitHub SHA의 짧은 버전 사용 (7자리)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        echo "TAG=master-$SHORT_SHA" >> $GITHUB_ENV
        
    - name: Update target environment image tag
      run: |
        echo "Service: backend"
        echo "Environment: prod"
        echo "Tag: ${{ env.TAG }}"
        echo "Repository: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
        cd ${{ env.CD_REPOSITORY }}/charts/portfolio/portfolio-backend
        # 이미지 태그 업데이트
        sed -i 's/tag:.*/tag: "${{ env.TAG }}"/g' values.yaml
        # Harbor 브랜치 설정 업데이트
        sed -i 's/branch:.*/branch: "${{ env.IMAGE_NAME }}"/g' values.yaml
        echo "Updated image tag to: ${{ env.TAG }}"
        echo "Updated harbor branch to: ${{ env.IMAGE_NAME }}"
        
    - name: Commit and push changes
      run: |
        cd ${{ env.CD_REPOSITORY }}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add charts/portfolio/portfolio-backend/values.yaml
        git commit -m "feat: Update portfolio-backend image tag to ${{ env.TAG }}"
        git push origin main
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 ArgoCD will automatically detect the new image tag and deploy it"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployment triggered!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
        echo "Tag: ${{ env.TAG }}"
        echo "ArgoCD will automatically sync and deploy the new image" 