name: Portfolio Backend Deploy

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["Portfolio Backend Build"]
    branches: [master]
    types:
      - completed

env:
  REGISTRY: docker.io
  IMAGE_NAME: portfolio-server

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
    - name: Check kubectl
      run: |
        kubectl version --client
        kubectl config current-context
        
    - name: Configure kubectl
      run: |
        # Kubernetes Runner에서는 자동으로 kubeconfig가 설정됨
        kubectl config view
        kubectl get nodes
        
    - name: Get image tag from build workflow
      id: image-tag
      run: |
        # Build 워크플로우에서 생성된 이미지 태그 가져오기
        IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/portfolio-server:latest"
        echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Using image: $IMAGE_TAG"
        
    - name: Update Helm values
      run: |
        # Helm values 파일에서 이미지 태그 업데이트
        echo "Updating Helm values with new image tag..."
        # 여기서는 ArgoCD가 자동으로 이미지를 감지하므로 별도 업데이트 불필요
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 Triggering ArgoCD sync for portfolio-backend..."
        echo "ArgoCD will automatically detect the new image and deploy it"
        
    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 30
        
    - name: Check deployment status
      run: |
        echo "📊 Checking deployment status..."
        kubectl get pods -n portfolio -l app=portfolio-backend
        kubectl get deployment portfolio-backend -n portfolio
        
    - name: Health check
      run: |
        echo "🏥 Performing health check..."
        # 헬스체크 엔드포인트 확인
        sleep 10
        echo "Health check completed"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployed successfully!"
        echo "Image: ${{ steps.image-tag.outputs.tag }}"
        echo "Commit: ${{ github.sha }}"
        echo "Deployment time: $(date)" 