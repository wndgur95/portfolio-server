name: Portfolio Backend Deploy

on:
  workflow_run:
    workflows: ["Portfolio Backend Build"]
    branches: [master]
    types:
      - completed

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: portfolio-server

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' }}
    
    steps:
    - name: Checkout k8s-enterprise
      uses: actions/checkout@v4
      with:
        repository: wndgur95/k8s-enterprise
        token: ${{ secrets.PAT_TOKEN }}
        path: k8s-enterprise
        
    - name: Update Helm chart image tag
      run: |
        cd k8s-enterprise
        # portfolio-backend values.yaml에서 이미지 태그를 해시값으로 업데이트
        yq eval '.image.tag = "${{ github.sha }}"' -i charts/portfolio/portfolio-backend/values.yaml
        echo "Updated image tag to: ${{ github.sha }}"
        
    - name: Commit and push changes
      run: |
        cd k8s-enterprise
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add charts/portfolio/portfolio-backend/values.yaml
        git commit -m "feat: Update portfolio-backend image tag to ${{ github.sha }}"
        git push origin main
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 ArgoCD will automatically detect the new image tag and deploy it"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployment triggered!"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Commit: ${{ github.sha }}"
        echo "ArgoCD will automatically sync and deploy the new image" 