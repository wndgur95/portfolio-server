name: Portfolio Backend Deploy

on:
  workflow_run:
    workflows: ["Portfolio Backend Build"]
    types:
      - completed
    branches: [ master ]

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: portfolio-backend
  CD_REPOSITORY: k8s-enterprise
  K8S_BRANCH: main

jobs:
  deploy:
    name: Update Helm Chart and Deploy
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout k8s-enterprise
      uses: actions/checkout@v4
      with:
        repository: wndgur95/${{ env.CD_REPOSITORY }}
        token: ${{ secrets.PAT_TOKEN }}
        path: ${{ env.CD_REPOSITORY }}
        ref: ${{ env.K8S_BRANCH }}
        
    - name: Set deployment tag
      id: set-tag
      run: |
        # GitHub SHA의 짧은 버전 사용 (7자리)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BRANCH_NAME="${{ github.ref_name }}"
        echo "TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
        echo "DEPLOYMENT_TAG=${BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
        
    - name: Update Helm values
      run: |
        echo "🔧 Updating Helm chart values..."
        echo "Service: portfolio-backend"
        echo "Environment: production"
        echo "Tag: ${{ env.DEPLOYMENT_TAG }}"
        echo "Repository: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
        
        cd ${{ env.CD_REPOSITORY }}/charts/portfolio/portfolio-backend
        
        # 백업 생성
        cp values.yaml values.yaml.backup
        
        # 이미지 태그 업데이트
        sed -i 's/tag:.*/tag: "${{ env.DEPLOYMENT_TAG }}"/g' values.yaml
        
        # 이미지 repository 업데이트
        sed -i 's|repository:.*|repository: "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"|g' values.yaml
        
        echo "✅ Updated image tag to: ${{ env.DEPLOYMENT_TAG }}"
        echo "✅ Updated repository to: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
        
        # 변경사항 확인
        echo "📋 Changes made:"
        diff values.yaml.backup values.yaml || echo "No differences found"
        
    - name: Commit and push changes
      run: |
        cd ${{ env.CD_REPOSITORY }}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # 변경사항 확인
        git status
        git diff charts/portfolio/portfolio-backend/values.yaml
        
        # 커밋 및 푸시
        git add charts/portfolio/portfolio-backend/values.yaml
        git commit -m "feat: Update portfolio-backend image tag to ${{ env.DEPLOYMENT_TAG }}

        - Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOYMENT_TAG }}
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Triggered by: ${{ github.actor }}"
        
        git push origin ${{ env.K8S_BRANCH }}
        
        echo "✅ Successfully pushed changes to ${{ env.K8S_BRANCH }} branch"
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 ArgoCD will automatically detect the new image tag and deploy it"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOYMENT_TAG }}"
        echo "ArgoCD Application: portfolio-backend"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployment triggered!"
        echo "=========================================="
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOYMENT_TAG }}"
        echo "🏷️  Tag: ${{ env.DEPLOYMENT_TAG }}"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "👤 Author: ${{ github.actor }}"
        echo "📝 Commit: ${{ github.sha }}"
        echo "🔄 ArgoCD will automatically sync and deploy the new image"
        echo "==========================================" 