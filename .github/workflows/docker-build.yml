name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        default: ''
      clean_cache:
        description: 'Clean build cache'
        required: false
        default: false
        type: boolean
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.ljh-project.mooo.com
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: harbor.ljh-project.mooo.com/portfolio-backend/master
        tags: |
          type=ref,event=branch
          type=sha,prefix=master-
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
          
    - name: Clean build cache (if requested)
      if: github.event.inputs.clean_cache == 'true'
      run: |
        echo "🧹 Cleaning build cache as requested..."
        docker builder prune -a -f
        echo "✅ Build cache cleaned!"
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./api.Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Clean up local Docker images
      run: |
        echo "🧹 Cleaning up local Docker images..."
        
        # 현재 빌드한 이미지 태그들 가져오기
        TAGS="${{ steps.meta.outputs.tags }}"
        
        # 각 태그에 대해 로컬 이미지 삭제
        for tag in $TAGS; do
          echo "🗑️ Removing local image: $tag"
          docker rmi $tag || echo "⚠️ Failed to remove $tag (may not exist locally)"
        done
        
        # 사용하지 않는 이미지들 정리
        echo "🧹 Removing unused images..."
        docker image prune -f
        
        # 사용하지 않는 빌드 캐시 정리
        echo "🧹 Removing unused build cache..."
        docker builder prune -f
        
        echo "✅ Local cleanup completed!"
        
    - name: Show disk usage
      run: |
        echo "📊 Disk usage after cleanup:"
        df -h
        echo ""
        echo "📊 Docker system info:"
        docker system df
        
    - name: Manual run info
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "🎯 Manual workflow execution completed!"
        echo "=========================================="
        echo "👤 Triggered by: ${{ github.actor }}"
        echo "🏷️  Custom tag: ${{ github.event.inputs.tag || 'Not specified' }}"
        echo "🧹 Cache cleaned: ${{ github.event.inputs.clean_cache }}"
        echo "📦 Images built: ${{ steps.meta.outputs.tags }}"
        echo "⏰ Started at: ${{ github.event.head_commit.timestamp || github.run_started_at }}"
        echo "=========================================="
