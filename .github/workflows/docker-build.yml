name: Build and Deploy Portfolio Backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        default: ''
      clean_cache:
        description: 'Clean build cache'
        required: false
        default: false
        type: boolean
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_NAME: master
  CD_REPOSITORY: k8s-enterprise
  K8S_BRANCH: main

jobs:
  build-and-push:
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    outputs:
      deployment_tag: ${{ steps.set-tag.outputs.deployment_tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.ljh-project.mooo.com
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: harbor.ljh-project.mooo.com/portfolio-backend/master
        tags: |
          type=ref,event=branch
          type=sha,prefix=master-
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
    
    - name: Set deployment tag
      id: set-tag
      run: |
        # GitHub SHA의 짧은 버전 사용 (7자리)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BRANCH_NAME="${{ github.ref_name }}"
        DEPLOYMENT_TAG="${BRANCH_NAME}-${SHORT_SHA}"
        echo "deployment_tag=${DEPLOYMENT_TAG}" >> $GITHUB_OUTPUT
        echo "DEPLOYMENT_TAG=${DEPLOYMENT_TAG}" >> $GITHUB_ENV
          
    - name: Clean build cache (if requested)
      if: github.event.inputs.clean_cache == 'true'
      run: |
        echo "🧹 Cleaning build cache as requested..."
        docker builder prune -a -f
        echo "✅ Build cache cleaned!"
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
#        file: ./api.Dockerfile
        file: ./app.Dockerfile
        push: true
        platforms: linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Clean up local Docker images
      run: |
        echo "🧹 Cleaning up local Docker images..."
        
        # 현재 빌드한 이미지 태그들 가져오기
        TAGS="${{ steps.meta.outputs.tags }}"
        
        # 각 태그에 대해 로컬 이미지 삭제
        for tag in $TAGS; do
          echo "🗑️ Removing local image: $tag"
          docker rmi $tag || echo "⚠️ Failed to remove $tag (may not exist locally)"
        done
        
        # 사용하지 않는 이미지들 정리
        echo "🧹 Removing unused images..."
        docker image prune -f
        
        # 사용하지 않는 빌드 캐시 정리
        echo "🧹 Removing unused build cache..."
        docker builder prune -f
        
        echo "✅ Local cleanup completed!"
        
    - name: Show disk usage
      run: |
        echo "📊 Disk usage after cleanup:"
        df -h
        echo ""
        echo "📊 Docker system info:"
        docker system df
        
    - name: Build info
      run: |
        echo "🎯 Docker build completed!"
        echo "=========================================="
        echo "👤 Triggered by: ${{ github.actor }}"
        echo "🏷️  Custom tag: ${{ github.event.inputs.tag || 'Not specified' }}"
        echo "🧹 Cache cleaned: ${{ github.event.inputs.clean_cache }}"
        echo "📦 Images built: ${{ steps.meta.outputs.tags }}"
        echo "🚀 Deployment tag: ${{ steps.set-tag.outputs.deployment_tag }}"
        echo "=========================================="

  deploy:
    name: Update Helm Chart and Deploy
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout k8s-enterprise
      uses: actions/checkout@v4
      with:
        repository: wndgur95/${{ env.CD_REPOSITORY }}
        token: ${{ secrets.PAT_TOKEN }}
        path: ${{ env.CD_REPOSITORY }}
        ref: ${{ env.K8S_BRANCH }}
        
    - name: Update Helm values
      run: |
        echo "🔧 Updating Helm chart values..."
        echo "Service: portfolio-backend"
        echo "Environment: production"
        echo "Tag: ${{ needs.build-and-push.outputs.deployment_tag }}"
        echo "Repository: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
        
        cd ${{ env.CD_REPOSITORY }}/charts/portfolio/portfolio-backend
        
        # 백업 생성
        cp values.yaml values.yaml.backup
        
        # 이미지 태그 업데이트
        sed -i 's/tag:.*/tag: "${{ needs.build-and-push.outputs.deployment_tag }}"/g' values.yaml
        
        # 이미지 repository 업데이트
        sed -i 's|repository:.*|repository: "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"|g' values.yaml
        
        echo "✅ Updated image tag to: ${{ needs.build-and-push.outputs.deployment_tag }}"
        echo "✅ Updated repository to: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}"
        
        # 변경사항 확인
        echo "📋 Changes made:"
        diff values.yaml.backup values.yaml || echo "No differences found"
        
    - name: Commit and push changes
      run: |
        cd ${{ env.CD_REPOSITORY }}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # 변경사항 확인
        git status
        git diff charts/portfolio/portfolio-backend/values.yaml
        
        # 커밋 및 푸시
        git add charts/portfolio/portfolio-backend/values.yaml
        git commit -m "feat: Update portfolio-backend image tag to ${{ needs.build-and-push.outputs.deployment_tag }}

        - Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.deployment_tag }}
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Triggered by: ${{ github.actor }}"
        
        git push origin ${{ env.K8S_BRANCH }}
        
        echo "✅ Successfully pushed changes to ${{ env.K8S_BRANCH }} branch"
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 ArgoCD will automatically detect the new image tag and deploy it"
        echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.deployment_tag }}"
        echo "ArgoCD Application: portfolio-backend"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployment triggered!"
        echo "=========================================="
        echo "📦 Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.deployment_tag }}"
        echo "🏷️  Tag: ${{ needs.build-and-push.outputs.deployment_tag }}"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "👤 Author: ${{ github.actor }}"
        echo "📝 Commit: ${{ github.sha }}"
        echo "🔄 ArgoCD will automatically sync and deploy the new image"
        echo "=========================================="
