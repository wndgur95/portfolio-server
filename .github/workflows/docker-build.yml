name: Build and Deploy Portfolio Backend

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        default: ''
      clean_cache:
        description: 'Clean build cache'
        required: false
        default: false
        type: boolean
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  REGISTRY: harbor.ljh-project.mooo.com
  PROJECT: portfolio-backend
  IMAGE_BASE: master
  CD_REPOSITORY: k8s-enterprise
  K8S_BRANCH: main

jobs:
  build-app:
    name: Build and Push App Image
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'apps/admin/') ||
      contains(github.event.head_commit.modified, 'apps/api/') ||
      contains(github.event.head_commit.modified, 'apps/batch/') ||
      contains(github.event.head_commit.modified, 'apps/game/') ||
      contains(github.event.head_commit.modified, 'apps/log/') ||
      contains(github.event.head_commit.modified, 'apps/socket/') ||
      contains(github.event.head_commit.modified, 'apps/src/') ||
      contains(github.event.head_commit.modified, 'libs/') ||
      contains(github.event.head_commit.modified, 'app.Dockerfile') ||
      contains(github.event.head_commit.modified, 'package.json')
    outputs:
      deployment_tag: ${{ steps.set-tag.outputs.deployment_tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set deployment tag
      id: set-tag
      run: |
        # GitHub SHA의 짧은 버전 사용 (7자리)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BRANCH_NAME="${{ github.ref_name }}"
        DEPLOYMENT_TAG="${BRANCH_NAME}-${SHORT_SHA}"
        echo "deployment_tag=${DEPLOYMENT_TAG}" >> $GITHUB_OUTPUT
        echo "DEPLOYMENT_TAG=${DEPLOYMENT_TAG}" >> $GITHUB_ENV
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.ljh-project.mooo.com
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata for App
      id: meta-app
      uses: docker/metadata-action@v5
      with:
        images: harbor.ljh-project.mooo.com/portfolio-backend/master/app
        tags: |
          type=ref,event=branch
          type=sha,prefix=master-
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
          
    - name: Clean build cache (if requested)
      if: github.event.inputs.clean_cache == 'true'
      run: |
        echo "🧹 Cleaning build cache as requested..."
        docker builder prune -a -f
        echo "✅ Build cache cleaned!"
        
    - name: Build and push App Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./app.Dockerfile
        push: true
        platforms: linux/arm64
        tags: ${{ steps.meta-app.outputs.tags }}
        labels: ${{ steps.meta-app.outputs.labels }}
        cache-from: type=gha,scope=app
        cache-to: type=gha,mode=max,scope=app
        
    - name: Clean up local Docker images
      run: |
        echo "🧹 Cleaning up local App Docker images..."
        
        # 현재 빌드한 이미지 태그들 가져오기
        TAGS="${{ steps.meta-app.outputs.tags }}"
        
        # 각 태그에 대해 로컬 이미지 삭제
        for tag in $TAGS; do
          echo "🗑️ Removing local image: $tag"
          docker rmi $tag || echo "⚠️ Failed to remove $tag (may not exist locally)"
        done
        
        # 사용하지 않는 이미지들 정리
        echo "🧹 Removing unused images..."
        docker image prune -f
        
        echo "✅ Local cleanup completed!"
        
    - name: Build info
      run: |
        echo "🎯 App Docker build completed!"
        echo "=========================================="
        echo "👤 Triggered by: ${{ github.actor }}"
        echo "🏷️  Custom tag: ${{ github.event.inputs.tag || 'Not specified' }}"
        echo "🧹 Cache cleaned: ${{ github.event.inputs.clean_cache }}"
        echo "📦 App Images built: ${{ steps.meta-app.outputs.tags }}"
        echo "🚀 Deployment tag: ${{ steps.set-tag.outputs.deployment_tag }}"
        echo "=========================================="

  build-job:
    name: Build and Push Job Image
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, 'apps/job/') ||
      contains(github.event.head_commit.modified, 'libs/') ||
      contains(github.event.head_commit.modified, 'job.Dockerfile') ||
      contains(github.event.head_commit.modified, 'package.json')
    outputs:
      deployment_tag: ${{ steps.set-tag.outputs.deployment_tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set deployment tag
      id: set-tag
      run: |
        # GitHub SHA의 짧은 버전 사용 (7자리)
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        BRANCH_NAME="${{ github.ref_name }}"
        DEPLOYMENT_TAG="${BRANCH_NAME}-${SHORT_SHA}"
        echo "deployment_tag=${DEPLOYMENT_TAG}" >> $GITHUB_OUTPUT
        echo "DEPLOYMENT_TAG=${DEPLOYMENT_TAG}" >> $GITHUB_ENV
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Harbor
      uses: docker/login-action@v3
      with:
        registry: harbor.ljh-project.mooo.com
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: Extract metadata for Job
      id: meta-job
      uses: docker/metadata-action@v5
      with:
        images: harbor.ljh-project.mooo.com/portfolio-backend/master/job
        tags: |
          type=ref,event=branch
          type=sha,prefix=master-
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
        
    - name: Build and push Job Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./job.Dockerfile
        push: true
        platforms: linux/arm64
        tags: ${{ steps.meta-job.outputs.tags }}
        labels: ${{ steps.meta-job.outputs.labels }}
        cache-from: type=gha,scope=job
        cache-to: type=gha,mode=max,scope=job
        
    - name: Clean up local Docker images
      run: |
        echo "🧹 Cleaning up local Job Docker images..."
        
        # 현재 빌드한 이미지 태그들 가져오기
        TAGS="${{ steps.meta-job.outputs.tags }}"
        
        # 각 태그에 대해 로컬 이미지 삭제
        for tag in $TAGS; do
          echo "🗑️ Removing local image: $tag"
          docker rmi $tag || echo "⚠️ Failed to remove $tag (may not exist locally)"
        done
        
        # 사용하지 않는 이미지들 정리
        echo "🧹 Removing unused images..."
        docker image prune -f
        
        echo "✅ Local cleanup completed!"
        
    - name: Build info
      run: |
        echo "🎯 Job Docker build completed!"
        echo "=========================================="
        echo "👤 Triggered by: ${{ github.actor }}"
        echo "🏷️  Custom tag: ${{ github.event.inputs.tag || 'Not specified' }}"
        echo "📦 Job Images built: ${{ steps.meta-job.outputs.tags }}"
        echo "🚀 Deployment tag: ${{ steps.set-tag.outputs.deployment_tag }}"
        echo "=========================================="
  
  show-disk-usage:
    name: Show Disk Usage
    runs-on: [self-hosted, kubernetes, portfolio-backend]
    needs: [build-app, build-job]
    if: |
      always() && 
      (needs.build-app.result == 'success' || needs.build-job.result == 'success')
    steps:
    - name: Show disk usage
      run: |
        echo "📊 Disk usage after cleanup:"
        df -h
        echo ""
        echo "📊 Docker system info:"
        docker system df
        
        # 사용하지 않는 빌드 캐시 정리
        echo "🧹 Removing unused build cache..."
        docker builder prune -f
        
        echo "✅ Final cleanup completed!"

  deploy:
    name: Update Helm Chart and Deploy
    runs-on: self-hosted
    needs: [build-app, build-job]
    if: |
      github.event_name != 'pull_request' && 
      (needs.build-app.result == 'success' || needs.build-job.result == 'success')
    
    steps:
    - name: Checkout k8s-enterprise
      uses: actions/checkout@v4
      with:
        repository: wndgur95/${{ env.CD_REPOSITORY }}
        token: ${{ secrets.PAT_TOKEN }}
        path: ${{ env.CD_REPOSITORY }}
        ref: ${{ env.K8S_BRANCH }}
        
    - name: Update Helm values
      run: |
        echo "🔧 Updating Helm chart values..."
        echo "Service: portfolio-backend"
        echo "Environment: production"
        
        DEPLOYMENT_TAG="${{ needs.build-app.outputs.deployment_tag || needs.build-job.outputs.deployment_tag }}"
        
        # App 이미지가 빌드된 경우에만 업데이트
        if [ "${{ needs.check-changes.outputs.should_build_app }}" == "true" ] && [ "${{ needs.build-app.result }}" == "success" ]; then
          echo "📦 Updating App image..."
          echo "Tag: $DEPLOYMENT_TAG"
          echo "Repository: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app"
          
          cd ${{ env.CD_REPOSITORY }}/charts/portfolio/portfolio-backend/app
          
          # App values.yaml 백업 생성
          cp values.yaml values.yaml.backup
          
          # App 이미지 태그 업데이트 (image.tag)
          sed -i 's/tag: ".*"/tag: "'"$DEPLOYMENT_TAG"'"/' values.yaml
          
          # App 이미지 repository 업데이트 (image.repository)
          sed -i 's|repository: ".*"|repository: "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app"|' values.yaml
          
          echo "✅ Updated App image tag to: $DEPLOYMENT_TAG"
          echo "✅ Updated App repository to: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app"
          
          # 변경사항 확인
          echo "📋 App changes:"
          diff values.yaml.backup values.yaml || echo "No differences found"
          
          cd -
        else
          echo "⏭️  Skipping App image update (not built)"
        fi
        
        # Job 이미지가 빌드된 경우에만 업데이트
        if [ "${{ needs.check-changes.outputs.should_build_job }}" == "true" ] && [ "${{ needs.build-job.result }}" == "success" ]; then
          echo "📦 Updating Job image..."
          echo "Tag: $DEPLOYMENT_TAG"
          echo "Repository: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job"
          
          cd ${{ env.CD_REPOSITORY }}/charts/portfolio/portfolio-backend/job
          
          # Job values.yaml 백업 생성
          cp values.yaml values.yaml.backup
          
          # Job 이미지 태그 업데이트 (image.tag)
          sed -i 's/tag: ".*"/tag: "'"$DEPLOYMENT_TAG"'"/' values.yaml
          
          # Job 이미지 repository 업데이트 (image.repository)
          sed -i 's|repository: ".*"|repository: "${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job"|' values.yaml
          
          echo "✅ Updated Job image tag to: $DEPLOYMENT_TAG"
          echo "✅ Updated Job repository to: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job"
          
          # 변경사항 확인
          echo "📋 Job changes:"
          diff values.yaml.backup values.yaml || echo "No differences found"
          
          cd -
        else
          echo "⏭️  Skipping Job image update (not built)"
        fi
        
    - name: Commit and push changes
      run: |
        cd ${{ env.CD_REPOSITORY }}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # 변경사항 확인
        git status
        
        DEPLOYMENT_TAG="${{ needs.build-app.outputs.deployment_tag || needs.build-job.outputs.deployment_tag }}"
        COMMIT_MSG="feat: Update portfolio-backend"
        COMMIT_DETAILS=""
        FILES_TO_ADD=""
        
        # App이 빌드된 경우
        if [ "${{ needs.check-changes.outputs.should_build_app }}" == "true" ] && [ "${{ needs.build-app.result }}" == "success" ]; then
          COMMIT_MSG="$COMMIT_MSG app"
          COMMIT_DETAILS="${COMMIT_DETAILS}
        - App Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app:${DEPLOYMENT_TAG}"
          FILES_TO_ADD="$FILES_TO_ADD charts/portfolio/portfolio-backend/app/values.yaml"
          git diff charts/portfolio/portfolio-backend/app/values.yaml
        fi
        
        # Job이 빌드된 경우
        if [ "${{ needs.check-changes.outputs.should_build_job }}" == "true" ] && [ "${{ needs.build-job.result }}" == "success" ]; then
          if [[ "$COMMIT_MSG" == *"app"* ]]; then
            COMMIT_MSG="$COMMIT_MSG and job"
          else
            COMMIT_MSG="$COMMIT_MSG job"
          fi
          COMMIT_DETAILS="${COMMIT_DETAILS}
        - Job Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job:${DEPLOYMENT_TAG}"
          FILES_TO_ADD="$FILES_TO_ADD charts/portfolio/portfolio-backend/job/values.yaml"
          git diff charts/portfolio/portfolio-backend/job/values.yaml
        fi
        
        COMMIT_MSG="$COMMIT_MSG image to ${DEPLOYMENT_TAG}"
        
        # 커밋 및 푸시
        git add $FILES_TO_ADD
        git commit -m "${COMMIT_MSG}${COMMIT_DETAILS}
        - Commit: ${{ github.sha }}
        - Branch: ${{ github.ref_name }}
        - Triggered by: ${{ github.actor }}"
        
        git push origin ${{ env.K8S_BRANCH }}
        
        echo "✅ Successfully pushed changes to ${{ env.K8S_BRANCH }} branch"
        
    - name: Trigger ArgoCD sync
      run: |
        echo "🚀 ArgoCD will automatically detect the new image tags and deploy them"
        
        DEPLOYMENT_TAG="${{ needs.build-app.outputs.deployment_tag || needs.build-job.outputs.deployment_tag }}"
        
        if [ "${{ needs.check-changes.outputs.should_build_app }}" == "true" ] && [ "${{ needs.build-app.result }}" == "success" ]; then
          echo "📦 App Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app:${DEPLOYMENT_TAG}"
        fi
        
        if [ "${{ needs.check-changes.outputs.should_build_job }}" == "true" ] && [ "${{ needs.build-job.result }}" == "success" ]; then
          echo "📦 Job Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job:${DEPLOYMENT_TAG}"
        fi
        
        echo "ArgoCD Application: portfolio-backend"
        
    - name: Deployment notification
      run: |
        echo "🎉 Portfolio Backend deployment triggered!"
        echo "=========================================="
        
        DEPLOYMENT_TAG="${{ needs.build-app.outputs.deployment_tag || needs.build-job.outputs.deployment_tag }}"
        
        if [ "${{ needs.check-changes.outputs.should_build_app }}" == "true" ] && [ "${{ needs.build-app.result }}" == "success" ]; then
          echo "📦 App Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/app:${DEPLOYMENT_TAG}"
        fi
        
        if [ "${{ needs.check-changes.outputs.should_build_job }}" == "true" ] && [ "${{ needs.build-job.result }}" == "success" ]; then
          echo "📦 Job Image: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.IMAGE_BASE }}/job:${DEPLOYMENT_TAG}"
        fi
        
        echo "🏷️  Tag: ${DEPLOYMENT_TAG}"
        echo "🌿 Branch: ${{ github.ref_name }}"
        echo "👤 Author: ${{ github.actor }}"
        echo "📝 Commit: ${{ github.sha }}"
        echo "🔄 ArgoCD will automatically sync and deploy the new images"
        echo "=========================================="
