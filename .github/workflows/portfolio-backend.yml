name: Portfolio Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: portfolio-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./api.Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Update ArgoCD
      if: github.ref == 'refs/heads/main'
      run: |
        # ArgoCD에 새로운 이미지 태그 알림
        echo "New image built: ${{ steps.meta.outputs.tags }}"
        echo "ArgoCD will automatically sync with the new image"
        
    - name: Notify deployment
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Portfolio Backend deployed successfully!"
        echo "Image: ${{ steps.meta.outputs.tags }}"
        echo "Commit: ${{ github.sha }}" 